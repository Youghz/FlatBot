name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "LICENSE"

env:
  PROJECT_ID: sandbox-hugo
  REGION: northamerica-northeast1
  JOB_NAME: flat-research
  REGISTRY: northamerica-northeast1-docker.pkg.dev/sandbox-hugo/flat-research/flat-research

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7"

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest tests/ -q --ignore=tests/test_integration.py

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7"

      - run: uv sync --frozen

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Integration tests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: uv run pytest tests/test_integration.py -q

  deploy:
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          SHA_TAG="${{ env.REGISTRY }}:${{ github.sha }}"
          LATEST_TAG="${{ env.REGISTRY }}:latest"
          docker build -t "$SHA_TAG" -t "$LATEST_TAG" .
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy to Cloud Run
        run: |
          gcloud run jobs update ${{ env.JOB_NAME }} \
            --image="${{ env.REGISTRY }}:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"

      - name: Smoke test
        run: |
          gcloud run jobs execute ${{ env.JOB_NAME }} \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --args="--check" \
            --wait

      - name: Cleanup old images (keep last 5)
        run: |
          gcloud artifacts docker images list "${{ env.REGISTRY }}" \
            --sort-by=~UPDATE_TIME --format="value(VERSION)" \
            | tail -n +6 \
            | xargs -rI {} gcloud artifacts docker images delete "${{ env.REGISTRY }}@{}" --quiet --delete-tags
