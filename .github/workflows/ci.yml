name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7"

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest tests/ -q --ignore=tests/test_integration.py

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7"

      - run: uv sync --frozen

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Debug secrets shape
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import os
          cid = os.environ.get('TELEGRAM_CHAT_ID','')
          tok = os.environ.get('TELEGRAM_BOT_TOKEN','')
          print(f'CHAT_ID length: {len(cid)}')
          print(f'CHAT_ID starts with dash: {cid.startswith(\"-\")}')
          print(f'CHAT_ID repr: {repr(cid[:3])}...{repr(cid[-3:])}')
          print(f'TOKEN length: {len(tok)}')
          print(f'TOKEN has colon: {\":\" in tok}')
          "

      - name: Integration tests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: uv run pytest tests/test_integration.py -q -s
