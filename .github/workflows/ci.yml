name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  UV_VERSION: "0.7"
  PROJECT_ID: sandbox-hugo
  REGION: northamerica-northeast1
  REGISTRY: northamerica-northeast1-docker.pkg.dev/sandbox-hugo/flat-research
  WEB_SERVICE: flatbot-web
  SCRAPER_JOB: flatbot-scraper
  DB_INSTANCE: flatbot-db

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest tests/ -q --ignore=tests/test_integration.py

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push images
        run: |
          docker build --target web \
            -t "${{ env.REGISTRY }}/flatbot-web:${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/flatbot-web:latest" .
          docker build --target scraper \
            -t "${{ env.REGISTRY }}/flatbot-scraper:${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/flatbot-scraper:latest" .
          docker push "${{ env.REGISTRY }}/flatbot-web:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/flatbot-web:latest"
          docker push "${{ env.REGISTRY }}/flatbot-scraper:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/flatbot-scraper:latest"

      - name: Deploy web service
        run: |
          gcloud run deploy ${{ env.WEB_SERVICE }} \
            --image="${{ env.REGISTRY }}/flatbot-web:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --allow-unauthenticated \
            --port=8080

      - name: Deploy scraper job
        run: |
          gcloud run jobs update ${{ env.SCRAPER_JOB }} \
            --image="${{ env.REGISTRY }}/flatbot-scraper:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"

      - name: Run Alembic migration
        run: |
          gcloud run jobs execute ${{ env.SCRAPER_JOB }} \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --args="--migrate" \
            --wait

      - name: Smoke test scraper connections
        run: |
          gcloud run jobs execute ${{ env.SCRAPER_JOB }} \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --args="--check" \
            --wait

      - name: Cleanup old images (keep 3 latest)
        run: |
          for repo in flatbot-web flatbot-scraper; do
            FULL="${{ env.REGISTRY }}/$repo"
            gcloud artifacts docker images list "$FULL" \
              --sort-by=~UPDATE_TIME --format="value(VERSION)" \
              | tail -n +4 \
              | xargs -rI {} gcloud artifacts docker images delete "$FULL@{}" --quiet --delete-tags
          done
