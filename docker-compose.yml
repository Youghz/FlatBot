services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flatbot}
      POSTGRES_DB: ${POSTGRES_DB:-flatbot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
